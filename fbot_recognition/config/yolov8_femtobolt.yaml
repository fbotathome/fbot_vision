yolov8_recognition_femtobolt:
  ros__parameters:
    threshold: 0.6
    start_on_init: True

    max_sizes:
      - [0.05, 0.05, 0.05]

    model_file: yolov8n.pt

    services:
      object_recognition:
        start: /fr/object_start
        stop: /fr/object_stop

    subscribers:
      slop: 0.2
      qos_profile: 10

      image_rgb: /femtobolt/color/image_raw
      camera_info: /femtobolt/color/camera_info
      image_depth: /femtobolt/depth/image_raw

    publishers:
      object_recognition:
        topic: /fr/object_recognition
        qos_profile: 10

      debug:
        topic: /fr/object_debug
        qos_profile: 10
