tracker_type: botsort  # tracker type, ['botsort', 'bytetrack']
track_high_thresh: 0.5  # threshold for the first association
track_low_thresh: 0.1  # threshold for the second association
new_track_thresh: 0.6  # threshold for init new track if the detection does not match any tracks
track_buffer: 30  # buffer to calculate the time when to remove tracks
match_thresh: 0.8  # threshold for matching tracks
# min_box_area: 10  # threshold for min box areas(for tracker evaluation, not used for now)
# mot20: False  # for tracker evaluation(not used for now)

# BoT-SORT settings
gmc_method: sparseOptFlow  # method of global motion compensation
# ReID model related thresh (used only when with_reid is True)
fuse_score: True
proximity_thresh: 0.5
appearance_thresh: 0.25
with_reid: False

      # ReID de aparencia do proprio tracker (BoT-SORT do Ultralytics) - DESATIVADO.
      # Para ativar: troque with_reid para True e descomente a linha "model" abaixo.
      #   - model: auto -> o
      #     Ultralytics carrega automaticamente um modelo extra, yolo26n-cls.pt, como
      #     ReID separado (precisa estar disponivel na Jetson e custa processamento).
      #   - A chave "model" e obrigatoria quando with_reid: True; sem ela o tracker
      #     falha ao iniciar (o Ultralytics nao completa este arquivo com defaults).
      #   - appearance_thresh: similaridade minima de aparencia para associar; o
      #     default do Ultralytics e 0.8 (0.25 aqui e permissivo e pode trocar IDs).

# model: auto
