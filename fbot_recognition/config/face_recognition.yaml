face_recognition:
  ros__parameters:
    threshold: 0.5
    knn_threshold: 0.5
    redis_host: 192.168.4.100
    redis_port: 6379

    subscribers:
      qos_profile: 1
      slop: 0.2

      image_rgb: /femtobolt/color/image_raw
      camera_info: /femtobolt/color/camera_info
      image_depth: /femtobolt/depth/image_raw

    publishers:
      face_recognition:
        topic: /fbot_vision/fr/face_recognition
        qos_profile: 1
      debug:
        topic: /fbot_vision/fr/debug_face
        qos_profile: 1

    servers:
      introduce_person:
        service: /fbot_vision/fr/introduce_person
      forget_person:
        service: /fbot_vision/fr/forget_person
